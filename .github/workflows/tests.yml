name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      device_platform:
        description: Disposable device acceptance (ordinary gates run with none)
        type: choice
        options: [none, android, apple, both]
        default: none

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apple:
    name: Apple checks
    if: github.event_name != 'workflow_dispatch' || inputs.device_platform == 'none'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          ruby -e 'require "yaml"; puts RUBY_VERSION'
      - name: Ensure watchOS simulator runtime
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep 'watchOS' >/dev/null; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes | grep 'watchOS' >/dev/null
      - name: Ensure the Metal compiler is available
        run: |
          set -euo pipefail
          if ! xcodebuild -showComponent MetalToolchain -json | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("status") != "installed")'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain -json
      - name: Run iPhone and Watch checks
        run: |
          set -euo pipefail
          make ios-test watch-build

  android:
    name: Android and repository checks
    if: github.event_name != 'workflow_dispatch' || inputs.device_platform == 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-licenses.txt"
          "$sdkmanager" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android and repository checks
        run: |
          set -euo pipefail
          make release-tests workflow-lint android-check

  Tests:
    name: Tests
    needs: [apple, android]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.device_platform == 'none') }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both platform gates
        env:
          APPLE_RESULT: ${{ needs.apple.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$APPLE_RESULT" = success
          test "$ANDROID_RESULT" = success

  android-device:
    name: Android device acceptance
    if: github.event_name == 'workflow_dispatch' && (inputs.device_platform == 'android' || inputs.device_platform == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACCEPTANCE_OUTPUT: /tmp/foodblob-android-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare owned-device tools and APKs before boot
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-licenses.txt"
          "$sdkmanager" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          scripts/android_gradle.sh --max-workers=1 --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx768m -XX:MaxMetaspaceSize=768m -XX:MaxDirectMemorySize=256m -XX:ActiveProcessorCount=1" \
            -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Execute focused nine then all ninety (all opt-ins, no skips)
        run: python3 scripts/hosted_android_acceptance.py
      - name: Clean only the owned Android device
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          marker = pathlib.Path(os.environ["ACCEPTANCE_OUTPUT"]) / "owned-device.json"
          if marker.exists():
              owner = json.loads(marker.read_text())
              assert owner["avd_name"].startswith("FoodBlobAcceptance_") and owner["serial"] == "emulator-5582"
              env = os.environ.copy()
              env["ANDROID_AVD_HOME"] = owner["avd_home"]
              subprocess.run([os.environ["ANDROID_HOME"] + "/platform-tools/adb", "-s", owner["serial"], "emu", "kill"], env=env, timeout=20)
              subprocess.run([os.environ["ANDROID_HOME"] + "/cmdline-tools/latest/bin/avdmanager", "delete", "avd", "--name", owner["avd_name"]], env=env, timeout=60)
          PYTHON
      - name: Record device outcome
        if: always()
        run: |
          if test -f "$ACCEPTANCE_OUTPUT/receipt.json"; then cat "$ACCEPTANCE_OUTPUT/receipt.json" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-device-${{ github.sha }}
          path: ${{ env.ACCEPTANCE_OUTPUT }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn

  apple-device:
    name: Apple UI acceptance
    if: github.event_name == 'workflow_dispatch' && (inputs.device_platform == 'apple' || inputs.device_platform == 'both')
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ACCEPTANCE_OUTPUT: /tmp/foodblob-apple-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure official Metal compiler component
        run: |
          set -euo pipefail
          if ! xcodebuild -showComponent MetalToolchain -json | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("status") != "installed")'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain -json
      - name: Execute all eight owned-simulator UI cases (no skips)
        env:
          OMP_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: python3 scripts/hosted_apple_acceptance.py
      - name: Clean only the owned Apple simulator
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, uuid
          marker = pathlib.Path(os.environ["ACCEPTANCE_OUTPUT"]) / "owned-simulator.json"
          if marker.exists():
              owner = json.loads(marker.read_text())
              uuid.UUID(owner["udid"])
              for action in ("shutdown", "delete"):
                  subprocess.run(["xcrun", "simctl", action, owner["udid"]], timeout=60)
          PYTHON
      - name: Record device outcome
        if: always()
        run: |
          if test -f "$ACCEPTANCE_OUTPUT/receipt.json"; then cat "$ACCEPTANCE_OUTPUT/receipt.json" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: apple-device-${{ github.sha }}
          path: ${{ env.ACCEPTANCE_OUTPUT }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
