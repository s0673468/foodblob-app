name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apple:
    name: Apple checks
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          ruby -e 'require "yaml"; puts RUBY_VERSION'
      - name: Ensure watchOS simulator runtime
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep 'watchOS' >/dev/null; then
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes | grep 'watchOS' >/dev/null
      - name: Ensure the Metal compiler is available
        run: |
          set -euo pipefail
          if ! xcodebuild -showComponent MetalToolchain -json | python3 -c 'import json, sys; sys.exit(json.load(sys.stdin).get("status") != "installed")'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain -json
      - name: Run iPhone and Watch checks
        run: |
          set -euo pipefail
          make ios-test watch-build

  android:
    name: Android and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$sdkmanager"
          printf 'y\n%.0s' {1..100} > "$RUNNER_TEMP/android-licenses.txt"
          "$sdkmanager" --licenses < "$RUNNER_TEMP/android-licenses.txt" > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android and repository checks
        run: |
          set -euo pipefail
          make release-tests workflow-lint android-check

  Tests:
    name: Tests
    needs: [apple, android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both platform gates
        env:
          APPLE_RESULT: ${{ needs.apple.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          test "$APPLE_RESULT" = success
          test "$ANDROID_RESULT" = success
